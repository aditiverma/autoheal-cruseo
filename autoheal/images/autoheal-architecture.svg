<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="835" viewBox="0 0 1400 835" role="img"><title>AutoHeal architecture diagram</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#93A3B7"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#4269D4"/></marker></defs><rect width="1400" height="835" fill="#F7F9FD"/><g font-family="Inter, Arial, Helvetica, sans-serif"><text x="64" y="75" font-size="19" font-weight="700" fill="#52718F" text-anchor="start" letter-spacing="2">AUTOHEAL  /  SYSTEM ARCHITECTURE</text><text x="64" y="128" font-size="35" font-weight="750" fill="#15233B" text-anchor="start">Agents propose. Policies authorize. Tests decide when done.</text><rect x="64" y="159" width="1272" height="86" rx="17" fill="#172642" stroke="none" stroke-width="1"/><text x="95" y="197" font-size="16" font-weight="750" fill="#9AB4DD" text-anchor="start" letter-spacing="1.5">USER GOAL</text><text x="95" y="226" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="start">Train a model that meets accuracy and loss requirements</text><path d="M700 245 V278" fill="none" stroke="#93A3B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="285" width="1272" height="100" rx="18" fill="#EAF1FF" stroke="#9FB5ED" stroke-width="2"/><text x="91" y="322" font-size="19" font-weight="750" fill="#244A9D" text-anchor="start" letter-spacing="1.0">RECURSIVE SUPERVISOR</text><text x="91" y="355" font-size="22" font-weight="450" fill="#253A60" text-anchor="start">Local Python  ·  Tracks goal, retries, evidence and next action</text><rect x="1085" y="306" width="220" height="52" rx="13" fill="#FFFFFF" stroke="#CAD7EF" stroke-width="1"/><text x="1195" y="338" font-size="19" font-weight="600" fill="#385273" text-anchor="middle">SQLite run history</text><rect x="64" y="433" width="297" height="244" rx="19" fill="#EAF1FF" stroke="#9FB5ED" stroke-width="2"/><text x="87" y="474" font-size="22" font-weight="800" fill="#2F5ABC" text-anchor="start">01  REASON</text><text x="87" y="510" font-size="15" font-weight="700" fill="#2F5ABC" text-anchor="start">CRUSOE MANAGED INFERENCE</text><rect x="86" y="527" width="253" height="1" rx="0" fill="#9FB5ED" stroke="none" stroke-width="1"/><text x="87" y="562" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  Nemotron diagnosis</text><text x="87" y="596" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  Nemotron repair proposal</text><text x="87" y="630" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  Advisory safety review</text><rect x="389" y="433" width="297" height="244" rx="19" fill="#FFF5DF" stroke="#EBC98B" stroke-width="2"/><text x="412" y="474" font-size="22" font-weight="800" fill="#976318" text-anchor="start">02  AUTHORIZE</text><text x="412" y="510" font-size="15" font-weight="700" fill="#976318" text-anchor="start">LOCAL DETERMINISTIC CODE</text><rect x="411" y="527" width="253" height="1" rx="0" fill="#EBC98B" stroke="none" stroke-width="1"/><text x="412" y="562" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  Allowed action types</text><text x="412" y="596" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  Configuration bounds</text><text x="412" y="630" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  Retry and risk limits</text><rect x="714" y="433" width="297" height="244" rx="19" fill="#EFF2F7" stroke="#CBD3DF" stroke-width="2"/><text x="737" y="474" font-size="22" font-weight="800" fill="#40516B" text-anchor="start">03  EXECUTE</text><text x="737" y="510" font-size="15" font-weight="700" fill="#40516B" text-anchor="start">LOCAL WORKLOAD RUNNER</text><rect x="736" y="527" width="253" height="1" rx="0" fill="#CBD3DF" stroke="none" stroke-width="1"/><text x="737" y="562" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  PyTorch training</text><text x="737" y="596" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  Data preparation</text><text x="737" y="630" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  Logs, metrics, artifacts</text><rect x="1039" y="433" width="297" height="244" rx="19" fill="#E6F6EF" stroke="#A6D9BE" stroke-width="2"/><text x="1062" y="474" font-size="22" font-weight="800" fill="#16744C" text-anchor="start">04  VERIFY</text><text x="1062" y="510" font-size="15" font-weight="700" fill="#16744C" text-anchor="start">INDEPENDENT CHECKS</text><rect x="1061" y="527" width="253" height="1" rx="0" fill="#A6D9BE" stroke="none" stroke-width="1"/><text x="1062" y="562" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  Reload model checkpoint</text><text x="1062" y="596" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  Check accuracy / loss</text><text x="1062" y="630" font-size="19" font-weight="480" fill="#283950" text-anchor="start">•  Verify trusted criteria</text><path d="M365 551 H386" fill="none" stroke="#93A3B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M690 551 H711" fill="none" stroke="#93A3B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1015 551 H1036" fill="none" stroke="#93A3B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="713" width="1272" height="86" rx="18" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="2"/><text x="94" y="751" font-size="17" font-weight="800" fill="#406080" text-anchor="start" letter-spacing="1">FEEDBACK LOOP</text><text x="94" y="778" font-size="20" font-weight="500" fill="#263950" text-anchor="start">Policy rejects → replan   ·   Verifier fails → revise experiment   ·   All checks pass → DONE</text><path d="M1188 677 V703 H245 V686" fill="none" stroke="#4269D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/><text x="1266" y="690" font-size="14" font-weight="550" fill="#51719C" text-anchor="end">results</text></g></svg>