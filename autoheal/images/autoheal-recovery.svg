<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="873" viewBox="0 0 1400 873" role="img"><title>AutoHeal verified recovery sequence</title><rect width="1400" height="873" fill="#F7F9FD"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="68" font-size="19" font-weight="700" fill="#52718F" text-anchor="start" letter-spacing="2">AUTOHEAL  /  VERIFIED RECOVERY</text><text x="64" y="119" font-size="35" font-weight="750" fill="#15233B" text-anchor="start">A real recovery is more than a successful exit code.</text><rect x="64" y="151" width="1272" height="76" rx="15" fill="#172642" stroke="none" stroke-width="1"/><text x="93" y="180" font-size="16" font-weight="750" fill="#A7C0E7" text-anchor="start" letter-spacing="1">DEFINITION OF DONE</text><text x="93" y="207" font-size="21" font-weight="550" fill="#fff" text-anchor="start">Checkpoint loads  ·  Accuracy meets minimum  ·  Loss stays below maximum</text><rect x="64" y="265" width="622" height="207" rx="18" fill="#EAF1FF" stroke="#9DB8EE" stroke-width="2"/><rect x="86" y="287" width="53" height="46" rx="12" fill="#FFFFFF" stroke="#9DB8EE" stroke-width="1"/><text x="112" y="318" font-size="23" font-weight="800" fill="#315BA9" text-anchor="middle">01</text><text x="155" y="307" font-size="15" font-weight="750" fill="#315BA9" text-anchor="start" letter-spacing="1">EXECUTION</text><text x="155" y="338" font-size="25" font-weight="750" fill="#17243B" text-anchor="start">Training completes</text><text x="91" y="382" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">But quality checks fail.</text><text x="91" y="410" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">Agent reviews metrics and proposes</text><text x="91" y="438" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">raising epochs from 2 to 10.</text><rect x="714" y="265" width="622" height="207" rx="18" fill="#FFF2DC" stroke="#E9BD79" stroke-width="2"/><rect x="736" y="287" width="53" height="46" rx="12" fill="#FFFFFF" stroke="#E9BD79" stroke-width="1"/><text x="762" y="318" font-size="23" font-weight="800" fill="#986119" text-anchor="middle">02</text><text x="805" y="307" font-size="15" font-weight="750" fill="#986119" text-anchor="start" letter-spacing="1">POLICY REJECTION</text><text x="805" y="338" font-size="25" font-weight="750" fill="#17243B" text-anchor="start">10 epochs denied</text><text x="741" y="382" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">Maximum allowed: 8 epochs.</text><text x="741" y="410" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">Rejection becomes new evidence.</text><text x="741" y="438" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">Agent replans within bounds.</text><rect x="64" y="537" width="622" height="207" rx="18" fill="#FFF2DC" stroke="#E9BD79" stroke-width="2"/><rect x="86" y="559" width="53" height="46" rx="12" fill="#FFFFFF" stroke="#E9BD79" stroke-width="1"/><text x="112" y="590" font-size="23" font-weight="800" fill="#986119" text-anchor="middle">03</text><text x="155" y="579" font-size="15" font-weight="750" fill="#986119" text-anchor="start" letter-spacing="1">VERIFIER REJECTION</text><text x="155" y="610" font-size="25" font-weight="750" fill="#17243B" text-anchor="start">Training improves</text><text x="91" y="654" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">8 epochs improves accuracy.</text><text x="91" y="682" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">Loss still misses its threshold.</text><text x="91" y="710" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">Agent tunes learning rate and retries.</text><rect x="714" y="537" width="622" height="207" rx="18" fill="#E4F6EC" stroke="#A7D8BA" stroke-width="2"/><rect x="736" y="559" width="53" height="46" rx="12" fill="#FFFFFF" stroke="#A7D8BA" stroke-width="1"/><text x="762" y="590" font-size="23" font-weight="800" fill="#16754C" text-anchor="middle">04</text><text x="805" y="579" font-size="15" font-weight="750" fill="#16754C" text-anchor="start" letter-spacing="1">VERIFIED SUCCESS</text><text x="805" y="610" font-size="25" font-weight="750" fill="#17243B" text-anchor="start">Goal is actually done</text><text x="741" y="654" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">Further training passes both metrics.</text><text x="741" y="682" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">Verifier reloads the checkpoint.</text><text x="741" y="710" font-size="20" font-weight="400" fill="#33445B" text-anchor="start">All trusted checks pass.</text><path d="M686 369 H704" fill="none" stroke="#4269D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="708,369 697,362 697,376" fill="#4269D4"/><path d="M1025 472 V506 H383 V527" fill="none" stroke="#4269D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="383,533 376,522 390,522" fill="#4269D4"/><path d="M686 640 H704" fill="none" stroke="#4269D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="708,640 697,633 697,647" fill="#4269D4"/><rect x="64" y="781" width="1272" height="60" rx="14" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1"/><text x="700" y="819" font-size="20" font-weight="550" fill="#40516B" text-anchor="middle">Every rejection informs the next attempt. Only the independent verifier can close the goal.</text></g></svg>